# Managed by ~/dotfiles (system/).
# Monitor all drives: health, error logs and self-test results (-a), skip
# drives in standby (-n standby,q), and run a short self-test every Sunday at 3.
# Warnings go to /usr/local/bin/smartd-notify (desktop notification + journal).
DEVICESCAN -a -n standby,q -s S/../../7/03 -m <nomailer> -M exec /usr/local/bin/smartd-notify
