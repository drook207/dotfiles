# Packages the dotfiles rely on and system services to enable, handled by
# run_onchange_after_00-install-packages.sh.tmpl.
# Repo names are CachyOS/Arch; "aur" packages are built with paru, which the
# script always installs (CachyOS repo, or built from the AUR on plain Arch).

[packages]
pacman = [
    # base tooling
    "chezmoi", "git", "github-cli", "glab", "curl", "jq", "unzip", "pacman-contrib", "fwupd", "snapper",
    "smartmontools", "libnotify", "btrfs-progs",
    # shell
    "fish", "starship", "zoxide", "fzf", "eza", "fd", "ripgrep", "bat",
    # terminal apps
    "ghostty", "neovim", "lazygit", "btop",
    "yazi", "7zip", "resvg",  # file manager (+ archive and SVG previews)
    "git-delta",              # diffs in git and lazygit
    # C/C++ development (gcc/make come with base-devel; clang has clangd, clang-format, clang-tidy)
    "base-devel", "cmake", "ninja", "clang", "gdb", "lldb", "ccache", "bear", "valgrind", "pkgconf",
    # toolchains Mason needs for the Go and Markdown/Prettier tools; ast-grep for grug-far
    "go", "nodejs", "npm", "python-pip", "ast-grep",
    # development
    "mise", "docker", "docker-compose", "docker-buildx", "lazydocker", "tree-sitter-cli",
    "dua-cli", "whois",
    # desktop
    "hyprland", "uwsm", "noctalia", "hyprpicker", "grim", "wl-clipboard", "swash",
    "slurp", "gpu-screen-recorder", "tesseract", "tesseract-data-eng", "tesseract-data-deu",
    "dolphin", "gnome-calculator", "firefox", "localsend",
    # media, documents, drives
    "mpv", "mpv-mpris", "imv", "evince", "xournalpp",
    "gvfs-mtp", "gvfs-smb", "gnome-disk-utility",
    # keep modules of the running kernel usable after kernel updates
    "kernel-modules-hook",
    # look and feel
    "ttf-jetbrains-mono-nerd", "adw-gtk-theme", "breeze-icons", "qt6ct",
]
aur = [
    "herdr-bin",                # SUPER+CTRL+Return
    "1password",                # SUPER+SHIFT+/
    "1password-cli",            # `op`, 1Password on the command line
]

# Packages that also count as installed when their command is already on the
# PATH, e.g. from an upstream install script (/usr/local/bin, ~/.local/bin).
[packages.commands]
starship = "starship"
herdr-bin = "herdr"

# System services enabled (and started) once their packages are installed
[packages.services]
system = [
    "paccache.timer",          # weekly: keep the last 3 versions of each package
    "fwupd-refresh.timer",     # refresh firmware metadata for `fwupdmgr update`
    "snapper-timeline.timer",  # hourly /home snapshots (snapper-home script)
    "docker.socket",           # start Docker on demand (no docker group, see binds.lua)
    "linux-modules-cleanup.service",  # kernel-modules-hook: clean old modules after reboot
    "btrfs-scrub@-.timer",     # monthly btrfs scrub of / (finds silently corrupted data)
    "smartd.service",          # SSD/HDD health monitoring (config in system/etc/smartd.conf)
]

# ufw rules ("<from> <port> <proto>") added when ufw is enabled
[packages.firewall]
allow = [
    "192.168.0.0/16 53317 tcp",  # LocalSend (home network only)
    "192.168.0.0/16 53317 udp",
]
