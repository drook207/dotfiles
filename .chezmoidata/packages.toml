# Packages the dotfiles rely on and system services to enable, handled by
# run_onchange_after_install-packages.sh.tmpl.
# Repo names are CachyOS/Arch; "aur" packages are built with paru.

[packages]
pacman = [
    # base tooling
    "chezmoi", "git", "github-cli", "curl", "jq", "unzip", "pacman-contrib", "fwupd", "snapper",
    # shell
    "fish", "starship", "zoxide", "fzf", "eza", "fd", "ripgrep", "bat",
    # terminal apps
    "ghostty", "neovim", "lazygit", "btop",
    # desktop
    "hyprland", "uwsm", "noctalia", "hyprpicker", "grim", "wl-clipboard", "swash",
    "dolphin", "gnome-calculator", "firefox",
    # look and feel
    "ttf-jetbrains-mono-nerd", "adw-gtk-theme", "breeze-icons", "qt6ct",
]
aur = [
    "herdr-bin",                # SUPER+CTRL+Return
    "1password",                # SUPER+SHIFT+/
]

# Packages that also count as installed when their command is already on the
# PATH, e.g. from an upstream install script (/usr/local/bin, ~/.local/bin).
[packages.commands]
starship = "starship"
herdr-bin = "herdr"

# System services enabled (and started) once their packages are installed
[packages.services]
system = [
    "paccache.timer",          # weekly: keep the last 3 versions of each package
    "fwupd-refresh.timer",     # refresh firmware metadata for `fwupdmgr update`
    "snapper-timeline.timer",  # hourly /home snapshots (snapper-home script)
]
